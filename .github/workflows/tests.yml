name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ['3.10', '3.12']
        os: [ubuntu-latest]
        include:
          - python: '3.12'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
