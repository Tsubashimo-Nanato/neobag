[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neobag"
version = "0.2.0"
description = "A small live ROS 2 bag recorder for your terminal"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["textual>=8.2.8,<9", "psutil>=5.9,<8"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "PyYAML>=6", "mcap>=1.2,<2"]

[project.scripts]
neobag = "neobag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
